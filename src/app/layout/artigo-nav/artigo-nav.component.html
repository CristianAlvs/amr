<nav class="artigo-nav" [attr.aria-label]="titulo()">
  <h2 class="artigo-nav__titulo">{{ titulo() }}</h2>
  <ol class="artigo-nav__lista">
    @for (secao of secoes(); track secao.fragment) {
      <li>
        <a [routerLink]="[]"
           [fragment]="secao.fragment"
           class="artigo-nav__link"
           [class.artigo-nav__link--ativa]="ativa() === secao.fragment"
           [attr.aria-current]="ativa() === secao.fragment ? 'true' : null">
          {{ secao.rotulo }}
        </a>
      </li>
    }
  </ol>
</nav>
