<section class="hero" id="hero">
  <div class="hero__bg" aria-hidden="true"></div>

  <app-navbar />

  <div class="hero__content container" id="conteudo" tabindex="-1">
    <h1 class="hero__title animate-fade-up">
      A Mensagem<br />
      <em>Revelada</em>
    </h1>
    <p class="hero__description animate-fade-up" style="--delay: 100ms">
      Transmissão dos cultos<br />
      Domingo 8h, 16h30 e 18h · Quarta 19h30
    </p>
    <div class="hero__buttons animate-fade-up" style="--delay: 200ms">
      <a href="https://www.youtube.com/@amensagemrevelada" target="_blank" rel="noopener noreferrer" class="btn btn--primary">
        Assistir no YouTube
        <span class="sr-only">(abre em nova aba)</span>
      </a>
      <a [routerLink]="[]" fragment="agenda" class="btn btn--outline">Ver Programação</a>
    </div>
  </div>
</section>
