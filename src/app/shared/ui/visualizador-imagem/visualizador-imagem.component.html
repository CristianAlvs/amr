<dialog #dialogo class="visualizador" aria-label="Imagem ampliada"
        (click)="aoClicarNoFundo($event)" (close)="imagem.set(null)">
  @if (imagem(); as foto) {
    <button type="button" class="visualizador__fechar" aria-label="Fechar imagem" (click)="fechar()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <figure class="visualizador__figura">
      <img class="visualizador__foto" [src]="foto.src" [alt]="foto.alt" decoding="async">
      @if (foto.legenda) {
        <figcaption class="visualizador__legenda">{{ foto.legenda }}</figcaption>
      }
    </figure>
  }
</dialog>
